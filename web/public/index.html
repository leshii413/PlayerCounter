<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Server stats</title>
  <meta name="description" content="Live players, activity and leaderboards for the BeamMP servers.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..700&family=Big+Shoulders+Display:wght@600;800;900&display=swap">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='5' width='28' height='22' rx='4' fill='%23F2C230' stroke='%231D2522' stroke-width='2.5'/%3E%3Ctext x='16' y='22' font-family='Arial Black,Arial' font-weight='900' font-size='15' text-anchor='middle' fill='%231D2522'%3E75%3C/text%3E%3C/svg%3E">
</head>
<body>
  <header class="masthead">
    <div class="wrap masthead-row">
      <h1 id="site-title">Server stats</h1>
      <p class="updated" id="updated" aria-live="polite">Loading…</p>
    </div>
  </header>

  <main>
    <section class="wrap plates-section" aria-labelledby="now-heading">
      <h2 id="now-heading" class="section-title">On the dirt right now</h2>
      <div class="plates" id="plates"></div>
    </section>

    <section class="wrap board-section" id="series-section" aria-labelledby="series-heading" hidden>
      <div class="board-head">
        <h2 id="series-heading" class="section-title">Seat time across the series</h2>
        <div class="toggle" role="group" aria-label="Leaderboard period" data-board="series"></div>
      </div>
      <div id="series-board"></div>
    </section>

    <div id="servers"></div>
  </main>

  <footer class="wrap footer">
    <p>Playtime counts time on a server minus time spent AFK. Times on the activity grid use each server's own calendar; everything else is shown in your local time.</p>
    <p>Stats by <a href="https://github.com/leshii413/PlayerCounter">PlayerCounter</a>. Data refreshes every few minutes.</p>
  </footer>

  <noscript><p class="wrap">This page needs JavaScript to load the stats.</p></noscript>
  <script src="app.js" defer></script>
</body>
</html>
